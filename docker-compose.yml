# One command to run FootieManager exactly as it will run on Azure Container Apps or AKS:
#   docker compose up --build        then open http://localhost:8000
# Reads AI and Fabric settings from backend/.env (copy backend/.env.example first; it may be empty).
services:
  app:
    build: .
    image: footiemanager:latest
    ports:
      - "8000:8000"
    env_file:
      - path: backend/.env
        required: false
    restart: unless-stopped
